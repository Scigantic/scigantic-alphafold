name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Offline only: tests marked "live" are skipped unless SCIGANTIC_ALPHAFOLD_LIVE=1.
      - name: Install + test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q -rs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mypy --strict src/scigantic_alphafold
