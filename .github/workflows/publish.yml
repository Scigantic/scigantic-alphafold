name: Publish to PyPI

# Publishes on a version tag (v0.1.0) using the PYPI_KEY token secret (same pattern as
# scigantic-nci, scigantic-pubchem, scigantic-chembl). Gated on the offline tests and the
# type check passing, and on the tag being exactly "v" + the version in _version.py.
# There is no manual trigger: a manual run could publish from any branch.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mypy --strict src/scigantic_alphafold

  publish:
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The tag must be v<version>
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/scigantic_alphafold/_version.py)
          if [ -z "$version" ]; then
            echo "::error::could not read __version__ from src/scigantic_alphafold/_version.py"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::ref $GITHUB_REF_TYPE '$GITHUB_REF_NAME' is not the tag v$version; nothing was published"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_KEY }}
        run: twine upload dist/*
