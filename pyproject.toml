[build-system]
# 77.0.3 is the first setuptools with SPDX license expressions and license-files (PEP 639).
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-alphafold"
dynamic = ["version"]
description = "Read single AlphaFold DB v6 structures with one HTTP range request against EBI's public bulk tars, using a prebuilt byte-offset index. No mirror, no account, no key, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Scigantic" }]
keywords = ["alphafold", "afdb", "protein-structure", "mmcif", "pdb", "uniprot", "structural-biology", "range-request"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
]

# Standard library only at runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.10"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-alphafold"
Issues = "https://github.com/Scigantic/scigantic-alphafold/issues"
Documentation = "https://github.com/Scigantic/scigantic-alphafold#readme"

[project.scripts]
scigantic-alphafold = "scigantic_alphafold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# The one place the version is written: src/scigantic_alphafold/_version.py.
version = { attr = "scigantic_alphafold._version.__version__" }

[tool.setuptools.package-data]
scigantic_alphafold = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: talks to the real EBI server or GitHub; skipped unless SCIGANTIC_ALPHAFOLD_LIVE=1",
]

[tool.mypy]
strict = true
